{% extends "base.html" %}
{% block title %}Scan Pass{% endblock %}
{% block content %}
<h1>Entry / Exit Scan</h1>
<div class="layout">
  <div class="panel">
    <div id="reader"></div>
    <p class="muted">Point the camera at the user's QR pass, or paste the code below.</p>
    <label>QR code <input id="token"></label>
    <button id="verify" class="btn">Verify</button>
  </div>
  <div class="panel">
    <p id="result"></p>
    <div id="otpBox" hidden>
      <h2>Exit OTP</h2>
      <p>Demo OTP sent to the user: <b id="shownOtp"></b></p>
      <label>Enter OTP <input id="otp" maxlength="6" inputmode="numeric"></label>
      <button id="exitBtn" class="btn">Confirm exit</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/admin_scan.js') }}"></script>
{% endblock %}
