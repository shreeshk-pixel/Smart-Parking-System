{% extends "base.html" %}
{% block title %}Manage Slots{% endblock %}
{% block content %}
<h2>Manage Slots</h2>
<form method="post" class="form inline box">
  <input type="hidden" name="action" value="add">
  <select name="location_id">{% for l in locations %}<option value="{{ l.id }}">{{ l.name }}</option>{% endfor %}</select>
  <input name="slot_number" placeholder="Slot no. e.g. A7" required>
  <select name="vehicle_type"><option>car</option><option>bike</option></select>
  <button class="btn">Add slot</button>
</form>
<table class="table">
<tr><th>Location</th><th>Slot</th><th>Type</th><th>Active</th><th></th></tr>
{% for s in slots %}
<tr>
  <form method="post">
  <td>{{ s.location_name }}</td>
  <td><input name="slot_number" value="{{ s.slot_number }}" size="5"></td>
  <td><select name="vehicle_type">
      <option {% if s.vehicle_type == 'car' %}selected{% endif %}>car</option>
      <option {% if s.vehicle_type == 'bike' %}selected{% endif %}>bike</option></select></td>
  <td><input type="checkbox" name="is_active" {% if s.is_active %}checked{% endif %}></td>
  <td><input type="hidden" name="id" value="{{ s.id }}">
      <button class="btn" name="action" value="edit">Save</button>
      <button class="btn" name="action" value="delete" onclick="return confirm('Delete this slot?')">Delete</button></td>
  </form>
</tr>
{% endfor %}
</table>
{% endblock %}
